name: Payment Service CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'payment-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Java ve Maven Ayarla
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: JAR Dosyasını Derle
        run: |
          cd payment-service
          mvn clean package -DskipTests

      - name: Docker Hub'a Giriş Yap
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: İmajı Oluştur ve Yükle
        run: |
          # Commit ID'nin ilk 7 hanesini etiket olarak alıyoruz (Profesyonel yaklaşım)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          docker build -t enesskaracay/payment-service:v1.0-$SHORT_SHA ./payment-service
          docker push enesskaracay/payment-service:v1.0-$SHORT_SHA

          # 'latest' etiketini de güncelliyoruz
          docker tag enesskaracay/payment-service:v1.0-$SHORT_SHA enesskaracay/payment-service:latest
          docker push enesskaracay/payment-service:latest